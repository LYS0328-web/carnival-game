<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三關｜抽兩球不同色</title>
<style>
body{background:#331e10;color:white;font-family:"Noto Sans TC";text-align:center;padding:20px;}
h1{margin-bottom:20px;}
#box{width:200px;height:200px;margin:0 auto;background:#aa5522;border-radius:20px;display:flex;justify-content:center;align-items:flex-end;position:relative;overflow:hidden;}
.ball{width:40px;height:40px;border-radius:50%;position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:30px;cursor:pointer;transition: all 0.8s ease;}
.option{background:#ffcf33;padding:12px;margin:10px auto;width:80%;max-width:300px;border-radius:10px;color:#320e00;font-weight:bold;cursor:pointer;}
.option:hover{background:#ffe27a;}
.btn{margin-top:20px;padding:10px 20px;font-size:18px;background:#999;border:none;border-radius:10px;color:#000;}
</style>
</head>
<body>

<h1>第三關：抽球（不放回，兩球不同色）</h1>
<div id="box">🎁</div>

<h2>題目：</h2>
<p>袋中有 <b>4 紅、4 黃、2 綠</b>。抽兩球（不放回），求兩球顏色不同的機率。</p>

<div class="option" onclick="check(1)">(1) 4/5</div>
<div class="option" onclick="check(2)">(2) 16/25</div>
<div class="option" onclick="check(3)">(3) 36/45</div>

<button class="btn" onclick="location.href='map.html'">返回地圖</button>

<script>
const colors = ['🔴','🔴','🔴','🔴','🟡','🟡','🟡','🟡','🟢','🟢'];
const box = document.getElementById("box");
colors.forEach((c,i)=>{
    const b = document.createElement('div');
    b.classList.add('ball');
    b.textContent = c;
    b.style.left = (50 + i*15) + 'px';
    box.appendChild(b);
    setTimeout(()=> b.style.top='140px', 300*i);
});

function check(n){
  if(n===2){
    alert('答對！前往第四關！');
    localStorage.setItem("stage3","cleared");
    location.href='stage4.html';
  }else{
    alert("答錯了，再試一次！");
  }
}
</script>

</body>
</html>
