<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選擇角色</title>

<style>
body{
    margin:0; background:#18122B; color:white; text-align:center;
    font-family:"Noto Sans TC";
}
h1{ margin-top:25px; font-size:28px; }
.wrap{
    display:flex; justify-content:center; flex-wrap:wrap;
    gap:20px; margin-top:20px;
}
.char{
    width:90px; height:90px; background:#393053; border-radius:15px;
    font-size:40px; display:flex; justify-content:center; 
    align-items:center; cursor:pointer; border:3px solid transparent;
    transition:.3s;
}
.char:hover{ transform:scale(1.1); }
.selected{
    border:3px solid #ffcf33; box-shadow:0 0 12px #ffcf33;
}
#confirmBtn{
    margin-top:30px; padding:12px 30px; font-size:20px;
    border:none; background:#ffcf33; color:#320e00;
    border-radius:12px; display:none; cursor:pointer;
}
</style>
</head>

<body>

<h1>選擇你的角色</h1>

<div class="wrap">
    <div class="char" onclick="pick(this,'🧙‍♂️')">🧙‍♂️</div>
    <div class="char" onclick="pick(this,'🧝‍♀️')">🧝‍♀️</div>
    <div class="char" onclick="pick(this,'🧑‍🚀')">🧑‍🚀</div>
    <div class="char" onclick="pick(this,'🤴')">🤴</div>
    <div class="char" onclick="pick(this,'🧜‍♀️')">🧜‍♀️</div>
    <div class="char" onclick="pick(this,'🦸‍♂️')">🦸‍♂️</div>
</div>

<button id="confirmBtn" onclick="goStage1()">開始冒險 ▶</button>

<script>
let choice = null;

function pick(el, icon){
    document.querySelectorAll(".char").forEach(c => c.classList.remove("selected"));
    el.classList.add("selected");
    choice = icon;
    document.getElementById("confirmBtn").style.display="inline-block";
}

function goStage1(){
    localStorage.setItem("player", choice);
    // 初始化關卡狀態
    for(let i=1;i<=5;i++) localStorage.setItem("stage"+i,"locked");
    localStorage.setItem("stage1","locked"); // 第一關先鎖，等進入關卡再判斷
    location.href="stage1.html";
}
</script>

</body>
</html>
