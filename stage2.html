<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第二關｜抽球放回</title>
<style>
body{background:#102533;color:white;font-family:"Noto Sans TC";text-align:center;padding:20px;}
h1{margin-bottom:20px;}
#box{width:200px;height:200px;margin:0 auto;background:#226688;border-radius:20px;display:flex;justify-content:center;align-items:flex-end;position:relative;overflow:hidden;}
.ball{width:40px;height:40px;border-radius:50%;position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:30px;cursor:pointer;transition: all 0.8s ease;}
.option{background:#ffcf33;padding:12px;margin:10px auto;width:80%;max-width:300px;border-radius:10px;color:#320e00;font-weight:bold;cursor:pointer;}
.option:hover{background:#ffe27a;}
.btn{margin-top:20px;padding:10px 20px;font-size:18px;background:#999;border:none;border-radius:10px;color:#000;}
</style>
</head>
<body>

<h1>第二關：抽球（放回）</h1>
<div id="box">🎁</div>

<h2>題目：</h2>
<p>袋中有 <b>2 紅、3 藍、5 綠</b> 共 10 顆球，每次抽出後都會放回。<br>
求連續抽兩次皆為藍球的機率？</p>

<div class="option" onclick="check(1)">(1) 9/100</div>
<div class="option" onclick="check(2)">(2) 9/50</div>
<div class="option" onclick="check(3)">(3) 3/10</div>

<button class="btn" onclick="location.href='map.html'">返回地圖</button>

<script>
const colors = ['🔴','🔴','🔵','🔵','🔵','🟢','🟢','🟢','🟢','🟢'];
const box = document.getElementById("box");
colors.forEach((c,i)=>{
    const b = document.createElement('div');
    b.classList.add('ball');
    b.textContent = c;
    b.style.left = (50 + i*15) + 'px';
    box.appendChild(b);
    setTimeout(()=> b.style.top = '140px', 300*i);
});

function check(n){
  if(n===1){ // 正確答案 3/10*3/10=9/100
    alert('答對了！前往第三關！');
    localStorage.setItem("stage2","cleared");
    location.href='stage3.html';
  }else{
    alert('再想想～');
  }
}
</script>

</body>
</html>
